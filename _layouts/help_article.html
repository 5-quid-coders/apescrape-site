<div class="drawer lg:drawer-open">
  <input id="my-drawer-2" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content">
    <div class="prose max-w-3xl p-8 lg:p-16 prose-headings:tracking-tight prose-a:text-primary prose-a:font-medium">
      {{ content }}
    </div>
  </div>
  <div class="drawer-side mt-0 max-lg:mt-16 bg-base-100 top-0 min-lg:top-16">
    <label for="my-drawer-2" aria-label="close sidebar" class="drawer-overlay z-8"></label>
    <ul class="menu border-r bg-base-100 border-r-base-300 text-base-content min-h-full w-72 p-4 gap-1 z-9">
      <li class="menu-title text-xs uppercase tracking-wider opacity-60">Documentation</li>
      {% for help_article in site.help %}
        <li>
          <a href="{{ help_article.url }}" class="{% if page.url == help_article.url %}bg-primary/10 text-primary font-semibold{% endif %}">{{ help_article.title }}</a>
        </li>
      {% endfor %}
    </ul>
  </div>
</div>
